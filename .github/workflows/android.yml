name: Android APK

# 安卓端 CI 只看 android/：该目录（或本文件）有改动就构建 release APK，桌面端的改动不会触发它。
# 签名钥匙是两个仓库 secrets：ONEPKU_KEYSTORE_BASE64（.jks 的 base64）与 ONEPKU_KEYSTORE_PASSWORD。
# 所有对外发布的包必须用同一把钥匙签，否则版本之间签名不一致，Android 会拒绝覆盖安装；
# 因此 release 事件下缺钥匙直接失败，fork 的 PR 读不到 secrets 时只出未签名包。
on:
  push:
    branches: [main, Android]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 还原签名钥匙
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEPKU_KEYSTORE_BASE64 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$EVENT_NAME" = "release" ]; then
              echo "缺少 ONEPKU_KEYSTORE_BASE64：往 Release 上挂 APK 必须用正式钥匙签名" >&2
              exit 1
            fi
            echo "没有签名钥匙（fork 的 PR 读不到 secrets 属正常），本次出未签名包。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/onepku-release.jks"
          echo "ONEPKU_KEYSTORE_FILE=$RUNNER_TEMP/onepku-release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          ONEPKU_KEYSTORE_PASSWORD: ${{ secrets.ONEPKU_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Read versionName
        id: version
        run: |
          v=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$v" ]; then
            echo "没能从 app/build.gradle.kts 读出 versionName" >&2
            exit 1
          fi
          # fork 的 PR 里这个值由提交方控制,挡掉路径分隔符与 shell 元字符,只留版本号常用字符。
          case "$v" in
            *[!A-Za-z0-9._-]*) echo "versionName 含非法字符: $v" >&2; exit 1 ;;
          esac
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "apk=onepku-android-v$v.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        env:
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "打包产物：$src"
          cp "$src" "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: onepku-android-apk
          path: android/${{ steps.version.outputs.apk }}
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/${{ steps.version.outputs.apk }}
