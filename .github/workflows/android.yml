name: Android APK

# 安卓端 CI 只看 android/：该目录（或本文件）有改动就构建 release APK，桌面端的改动不会触发它。
#
# 发安卓版：推 `onepku-for-android-vX.Y.Z` 标签（版本号必须与 app/build.gradle.kts 的 versionName 一致），
# 本工作流构建后创建一个**预发布** Release。标预发布是为了不抢 GitHub 的 `releases/latest` 指针——
# 桌面端的更新清单就读那个地址（`latest.json` 只挂在桌面 Release 上）。安卓端不依赖 latest，
# 它在 releases 列表里按资产名 `onepku-android-v*.apk` 认最新。
#
# 签名钥匙是两个仓库 secrets：ONEPKU_KEYSTORE_BASE64（.jks 的 base64）与 ONEPKU_KEYSTORE_PASSWORD。
# 所有对外发布的包必须用同一把钥匙签，否则版本之间签名不一致，Android 会拒绝覆盖安装；
# 因此标签构建缺钥匙直接失败，fork 的 PR 读不到 secrets 时只出未签名包。
on:
  push:
    branches: [main, Android]
    tags: ["onepku-for-android-*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 还原签名钥匙
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEPKU_KEYSTORE_BASE64 }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              echo "缺少 ONEPKU_KEYSTORE_BASE64：发安卓 Release 必须用正式钥匙签名" >&2
              exit 1
            fi
            echo "没有签名钥匙（fork 的 PR 读不到 secrets 属正常），本次出未签名包。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/onepku-release.jks"
          echo "ONEPKU_KEYSTORE_FILE=$RUNNER_TEMP/onepku-release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          ONEPKU_KEYSTORE_PASSWORD: ${{ secrets.ONEPKU_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Read versionName
        id: version
        run: |
          v=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$v" ]; then
            echo "没能从 app/build.gradle.kts 读出 versionName" >&2
            exit 1
          fi
          # fork 的 PR 里这个值由提交方控制,挡掉路径分隔符与 shell 元字符,只留版本号常用字符。
          case "$v" in
            *[!A-Za-z0-9._-]*) echo "versionName 含非法字符: $v" >&2; exit 1 ;;
          esac
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "apk=onepku-android-v$v.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        env:
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "打包产物：$src"
          cp "$src" "$APK_NAME"

      # 产物本身要登录才能下载，签名状态写进运行摘要就不用翻日志：
      # 文件名是 app-release.apk 说明带上了正式钥匙，app-release-unsigned.apk 就是没配 secrets。
      - name: 记录产物与签名状态
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          {
            echo "### 安卓包与签名"
            echo "- 正式钥匙：${SIGNED:-unknown}"
            echo "- 构建产物：${src}"
            echo "- 发布文件名：${APK_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: onepku-android-apk
          path: android/${{ steps.version.outputs.apk }}
          retention-days: 30

      - name: 发布安卓预发布 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          if [ "$TAG" != "onepku-for-android-v$VERSION" ]; then
            echo "标签 $TAG 与 versionName $VERSION 不一致，拒绝发布" >&2
            exit 1
          fi
          gh release create "$TAG" --prerelease --title "OnePKU for Android v$VERSION" \
            --notes "更新内容见仓库 CHANGELOG.md 的「Android 版」一节。从 v0.3.2 及更早的版本升级要先卸载：那些包由构建机临时生成的 debug 钥匙签名，与本包不是同一把钥匙，系统会拒绝覆盖安装。" \
            "$APK_NAME" \
            || gh release upload "$TAG" --clobber "$APK_NAME"
