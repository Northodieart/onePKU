# 推送 v* 标签时构建 macOS（Apple Silicon）和 Windows x64，两端的资产与 latest.json
# 先收在同一个草稿 Release 上，最后一个 publish 作业确认两边都成功后直接发布，
# 不需要维护者再手动点一次；任一平台作业失败就留在草稿，等于自动拦住半份更新包。
# 资产：OnePKU.app.zip（手动下载）、OnePKU.app.tar.gz + .sig 与 latest.json（应用内更新）。
# 这里只打桌面端的包。安卓端由 .github/workflows/android.yml 走自己的预发布 Release，
# 挂到桌面版标签上会让 releases/latest 变成安卓包。
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/curriculum/check.mjs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OnePKU ${{ github.ref_name }}"
          releaseBody: "更新内容见仓库 CHANGELOG.md。首次安装的打开方法见 README「安装」。"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin -- --locked
      - name: Zip .app for manual download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP=target/aarch64-apple-darwin/release/bundle/macos/OnePKU.app
          ditto -c -k --keepParent "$APP" OnePKU.app.zip
          gh release upload "${{ github.ref_name }}" OnePKU.app.zip --clobber

  windows:
    # Serialize latest.json updates: tauri-action reads existing platforms before adding this one.
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run curriculum:check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OnePKU ${{ github.ref_name }}"
          releaseBody: "更新内容见仓库 CHANGELOG.md。首次安装的打开方法见 README「安装」。"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc --bundles nsis -- --locked

  publish:
    # 两个平台作业都成功才会跑：草稿上已经有了两端的包与合并好的 latest.json，
    # 直接发布出去，省掉手动确认；任一作业失败就留在草稿，不会放出半份更新通道。
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$TAG" --draft=false
          count=$(gh release view "$TAG" --json assets --jq '.assets | length')
          {
            echo "### Release 已自动发布"
            echo "- 标签：${TAG}"
            echo "- 资产：${count} 个"
          } >> "$GITHUB_STEP_SUMMARY"
